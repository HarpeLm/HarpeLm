<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="Stack: Rust, Swift and SwiftUI, Python, web, Burn and ONNX">
  <defs>
    <style>
      .k { font: 600 11px "SF Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: 2.5px; fill: #9198A1; }
      .v { font: 800 30px -apple-system, "SF Pro Display", "Segoe UI", Inter, Arial, sans-serif; }
      .u { font: 500 13px -apple-system, "SF Pro Text", "Segoe UI", Inter, Arial, sans-serif; fill: #9198A1; }
      .live { animation: b 1.2s steps(1) infinite; }
      @keyframes b { 50% { opacity: .2; } }
    </style>
    <clipPath id="screen"><rect x="0" y="0" width="1200" height="210" rx="20"/></clipPath>
  </defs>
  <rect width="1200" height="210" rx="20" fill="#0D1117" stroke="#F0F3F6" stroke-opacity=".08"/>
  <g clip-path="url(#screen)">
    <text x="28" y="38" class="k">STACK MONITOR</text>
    <circle cx="1160" cy="34" r="5" fill="#3FB950" class="live"/>
    <text x="1146" y="38" class="k" text-anchor="end">LIVE</text>

    <g transform="translate(28 70)">
      <text class="k" y="0" fill="#F74C00">RUST</text>
      <text class="v" y="40" fill="#F74C00">Daily</text>
      <text class="u" y="62">engines, tools, ML</text>
      <path d="M0 96 h40 l8 -16 l8 28 l8 -36 l8 24 h100" fill="none" stroke="#F74C00" stroke-width="2.5" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="0 0;-40 0;0 0" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(318 70)">
      <text class="k" y="0" fill="#FF4D6D">SWIFT · SWIFTUI</text>
      <text class="v" y="40" fill="#FF4D6D">iOS</text>
      <text class="u" y="62">Studyground, AquApp, Framey</text>
      <path d="M0 96 h60 l8 -12 l8 20 l8 -24 l8 16 h80" fill="none" stroke="#FF4D6D" stroke-width="2.5" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="0 0;-30 0;0 0" dur="3.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(608 70)">
      <text class="k" y="0" fill="#8957E5">BURN · ONNX</text>
      <text class="v" y="40" fill="#8957E5">ML</text>
      <text class="u" y="62">deep learning, upstream</text>
      <path d="M0 96 h30 l8 -20 l8 32 l8 -28 l8 20 h100" fill="none" stroke="#8957E5" stroke-width="2.5" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="0 0;-36 0;0 0" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(898 70)">
      <text class="k" y="0" fill="#58A6FF">PYTHON · WEB</text>
      <text class="v" y="40" fill="#58A6FF">Tools</text>
      <text class="u" y="62">scripts, HTML, CSS, JS</text>
      <path d="M0 96 h80 l8 -10 l8 16 l8 -18 l8 12 h70" fill="none" stroke="#58A6FF" stroke-width="2.5" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="translate" values="0 0;-24 0;0 0" dur="3.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
