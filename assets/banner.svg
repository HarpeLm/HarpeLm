<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="HarpeLm: medical student in Geneva who builds things from scratch">
  <defs>
    <linearGradient id="beat" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="1140" y2="0">
      <stop offset="0" stop-color="#FF4D6D"/><stop offset="0.5" stop-color="#F74C00"/><stop offset="1" stop-color="#8957E5"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#FF4D6D" stroke-opacity=".06"/>
    </pattern>
    <style>
      .name { font: 800 64px -apple-system, "SF Pro Display", "Segoe UI", Inter, Arial, sans-serif; fill: #F0F3F6; letter-spacing: -1px; }
      .sub  { font: 500 21px -apple-system, "SF Pro Text", "Segoe UI", Inter, Arial, sans-serif; fill: #9198A1; }
      .mono { font: 600 13px "SF Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: 3px; }
      .fade { animation: in 1s ease-out backwards; }
      .d1 { animation-delay: .4s; } .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.2s; }
      @keyframes in { from { opacity: 0; } to { opacity: 1; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1200" height="320" rx="24" fill="#0D1117"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="23.5" fill="none" stroke="#F0F3F6" stroke-opacity=".08"/>

  <text x="60" y="64" class="mono fade" fill="#FF4D6D">GENEVA · CH</text>
  <text x="1140" y="64" class="mono fade" fill="#9198A1" text-anchor="end">HR 72 · BUILD PASSING</text>

  <text x="60" y="150" class="name fade d1">HarpeLm<tspan fill="#F74C00" class="cursor">_</tspan></text>
  <text x="60" y="190" class="sub fade d2">Medical student who learns by building things from scratch,</text>
  <text x="60" y="218" class="sub fade d2">in Rust and Swift.</text>

  <path d="M60 272 H420 L440 272 L452 248 L464 296 L478 220 L492 288 L504 272 H640 L652 262 L664 272 H1140"
        fill="none" stroke="#21262D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 272 H420 L440 272 L452 248 L464 296 L478 220 L492 288 L504 272 H640 L652 262 L664 272 H1140"
        fill="none" stroke="url(#beat)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="1200" stroke-dashoffset="1200">
    <animate attributeName="stroke-dashoffset" values="1200;0;0;-1200" keyTimes="0;0.55;0.75;1" dur="5s" repeatCount="indefinite"/>
  </path>
  <circle r="5" fill="#F74C00">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.55;1" calcMode="linear"
      path="M60 272 H420 L440 272 L452 248 L464 296 L478 220 L492 288 L504 272 H640 L652 262 L664 272 H1140"/>
    <animate attributeName="r" values="4;6;4" dur="0.8s" repeatCount="indefinite"/>
  </circle>
  <text x="1140" y="254" class="mono fade d3" fill="#8957E5" text-anchor="end">cargo run --release</text>
</svg>
