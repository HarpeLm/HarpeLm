<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="HarpeLm: medical student in Geneva who builds things from scratch">
  <defs>
    <linearGradient id="beat" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="1140" y2="0">
      <stop offset="0" stop-color="#FF4D6D"/><stop offset="0.5" stop-color="#F74C00"/><stop offset="1" stop-color="#8957E5"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#FF4D6D" stroke-opacity=".06"/>
    </pattern>
    <filter id="glow" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <path id="trace" d="M60 272 H420 L440 272 L452 248 L464 296 L478 220 L492 288 L504 272 H640 L652 262 L664 272 H1140"/>
    <style>
      .name { font: 800 64px -apple-system, "SF Pro Display", "Segoe UI", Inter, Arial, sans-serif; fill: #F0F3F6; letter-spacing: -1px; }
      .sub  { font: 500 21px -apple-system, "SF Pro Text", "Segoe UI", Inter, Arial, sans-serif; fill: #9198A1; }
      .mono { font: 600 13px "SF Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: 3px; }
      .fade { animation: in 1s ease-out backwards; }
      .d2 { animation-delay: 1.9s; } .d3 { animation-delay: 2.3s; }
      @keyframes in { from { opacity: 0; } to { opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="320" rx="24" fill="#0D1117"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="23.5" fill="none" stroke="#F0F3F6" stroke-opacity=".08"/>

  <text x="60" y="64" class="mono fade" fill="#FF4D6D">GENEVA · CH</text>
  <text x="1140" y="64" class="mono fade" fill="#9198A1" text-anchor="end">HR 72 · BUILD PASSING</text>

  <!-- Typed one key at a time, the cursor stepping along after each letter. -->
  <text x="60" y="150" class="name">
    <tspan opacity="0">H<set attributeName="opacity" to="1" begin="0.35s" fill="freeze"/></tspan><tspan opacity="0">a<set attributeName="opacity" to="1" begin="0.5s" fill="freeze"/></tspan><tspan opacity="0">r<set attributeName="opacity" to="1" begin="0.68s" fill="freeze"/></tspan><tspan opacity="0">p<set attributeName="opacity" to="1" begin="0.82s" fill="freeze"/></tspan><tspan opacity="0">e<set attributeName="opacity" to="1" begin="1.0s" fill="freeze"/></tspan><tspan opacity="0">L<set attributeName="opacity" to="1" begin="1.22s" fill="freeze"/></tspan><tspan opacity="0">m<set attributeName="opacity" to="1" begin="1.38s" fill="freeze"/></tspan>
  </text>
  <rect y="146" width="30" height="7" rx="1.5" fill="#F74C00">
    <animate attributeName="x" calcMode="discrete" fill="freeze"
             values="60;108;144;168;206;242;277;334"
             keyTimes="0;0.2;0.29;0.38;0.45;0.54;0.65;0.73" dur="1.9s"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.05s" begin="1.9s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="190" class="sub fade d2">Medical student who learns by building things from scratch,</text>
  <text x="60" y="218" class="sub fade d2">in Rust and Swift.</text>

  <!-- A monitor sweep: the dim trace stays, a bright pulse glides along it, round and round. -->
  <use href="#trace" fill="none" stroke="#21262D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#trace" fill="none" stroke="url(#beat)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
       stroke-dasharray="240 1300" stroke-opacity=".55" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="240;-1266" dur="4.2s" repeatCount="indefinite"/>
  </use>
  <use href="#trace" fill="none" stroke="url(#beat)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
       stroke-dasharray="240 1300">
    <animate attributeName="stroke-dashoffset" values="240;-1266" dur="4.2s" repeatCount="indefinite"/>
  </use>
  <circle r="5" fill="#FFB38A">
    <animateMotion dur="4.2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.84;1" calcMode="linear">
      <mpath href="#trace"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.84;0.86;1" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <text x="1140" y="254" class="mono fade d3" fill="#8957E5" text-anchor="end">cargo run --release</text>
</svg>
